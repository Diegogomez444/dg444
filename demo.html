// ---------- SHA-256 helper ----------
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function randomSalt() {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2,'0')).join('');
}

// ---------- Fecha de hoy ISO ----------
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysAgoISO(n) {
  const d = new Date(Date.now() - n * 86400000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function weekDataForToday() {
  // [L,M,X,J,V,S,D] — rellenar días pasados de la semana con datos realistas
  const dayOfWeek = new Date().getDay(); // 0=Dom
  const todayIdx = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const past = [9, 10, 8, 11, 7, 5]; // datos de días anteriores
  const data = [0,0,0,0,0,0,0];
  for (let i = 0; i < todayIdx; i++) data[i] = past[i] || 0;
  data[todayIdx] = 6; // hoy: 6 completados
  return data;
}
